<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議重點簡報</title>
<style>
:root{color-scheme:light;--ink:#17362e;--paper:#f8f6ee;--accent:#b95432;--muted:#52675f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17362e;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
body{padding:28px 24px 100px}.deck{max-width:1280px;margin:auto}.slide{position:relative;min-height:640px;padding:64px 76px;background:var(--paper);border-top:10px solid var(--accent);display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere}.slide[hidden]{display:none}.eyebrow{font-size:18px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin:0 0 24px}h1,h2{font-size:clamp(32px,4.4vw,60px);line-height:1.22;letter-spacing:-.03em;margin:0 0 32px;max-width:19em}p,li{font-size:clamp(22px,2.1vw,30px);line-height:1.6}p{margin:12px 0}ul{margin:0;padding-left:1.3em}li+li{margin-top:16px}.note{font-size:18px;color:var(--muted);margin-top:32px}.toolbar{position:fixed;z-index:3;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:16px;background:#17362e;color:white;flex-wrap:wrap}button{font:inherit;font-size:16px;border:1px solid #b8c6bf;border-radius:8px;padding:10px 16px;min-height:44px;background:#fff;color:var(--ink);cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #e8b266;outline-offset:3px}#status{min-width:64px;text-align:center}#help{font-size:14px;margin:0;color:#e2e9e4}body:fullscreen{overflow:auto}.deck:focus{outline:none}
@media(max-width:700px){body{padding:12px 12px 150px}.slide{padding:36px 28px;min-height:68vh}.eyebrow{font-size:15px}.note{font-size:16px}.toolbar{gap:8px;padding:10px}button{padding:8px 10px}#help{width:100%;text-align:center}}
@media print{@page{size:A4 landscape;margin:0}html,body{background:#fff!important;margin:0!important;padding:0!important}.deck{max-width:none;margin:0}.toolbar{display:none!important}.slide,.slide[hidden]{display:flex!important;break-after:page;page-break-after:always;break-inside:avoid;width:297mm;height:210mm;min-height:0;margin:0;padding:17mm 20mm;border-top:3mm solid var(--accent);overflow:visible;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-child{break-after:auto;page-break-after:auto}h1,h2{font-size:34pt;margin-bottom:9mm}.eyebrow{font-size:13pt;margin-bottom:6mm}p,li{font-size:20pt;line-height:1.5}li+li{margin-top:4mm}.note{font-size:12pt;margin-top:8mm}}
</style>
</head>
<body>
<main class="deck" id="deck" tabindex="-1" aria-label="簡報">
<section class="slide" aria-label="第 1 頁">
<p class="eyebrow">本次重點</p>
<h1>把討論變成下一步</h1>
<p>用一句話說明這次討論最重要的結論。</p>
<p class="note">請以實際材料替換此範例內容。</p>
</section>
<section class="slide" aria-label="第 2 頁" hidden>
<p class="eyebrow">共識與待確認</p>
<h2>我們已經知道什麼？</h2>
<ul><li>第一個有依據的重點。</li><li>第二個有依據的重點。</li><li>還缺的資訊，標為待確認。</li></ul>
</section>
<section class="slide" aria-label="第 3 頁" hidden>
<p class="eyebrow">下一步</p>
<h2>先完成一件具體的事</h2>
<ul><li>要做的事：依會議紀錄填入。</li><li>負責人：沒有資料就寫待確認。</li><li>時間：沒有共識就寫待確認。</li></ul>
</section>
</main>
<nav class="toolbar" aria-label="播放控制">
<button id="prev" type="button" aria-label="上一頁">← 上一頁</button>
<span id="status" role="status" aria-live="polite"></span>
<button id="next" type="button" aria-label="下一頁">下一頁 →</button>
<button id="fullscreen" type="button">全螢幕</button>
<button id="print" type="button">存成 PDF</button>
<p id="help">方向鍵換頁 · Esc 離開全螢幕</p>
</nav>
<script>
(()=>{'use strict';
const slides=[...document.querySelectorAll('.slide')];let current=0;
const prev=document.getElementById('prev'),next=document.getElementById('next'),full=document.getElementById('fullscreen');
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((s,i)=>{s.hidden=i!==current;s.setAttribute('aria-label',`第 ${i+1} 頁，共 ${slides.length} 頁`)});prev.disabled=current===0;next.disabled=current===slides.length-1;document.getElementById('status').textContent=`${current+1} / ${slides.length}`;}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home'){e.preventDefault();show(0)}if(e.key==='End'){e.preventDefault();show(slides.length-1)}});
full.addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{document.getElementById('help').textContent='請使用瀏覽器選單的全螢幕功能。'}}catch{document.getElementById('help').textContent='請使用瀏覽器選單的全螢幕功能。'}});
document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});
document.getElementById('print').addEventListener('click',()=>window.print());show(0);
})();
</script>
</body>
</html>
